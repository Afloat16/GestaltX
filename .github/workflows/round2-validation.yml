name: Round 2 native validation
on:
  push:
    branches: [validation/gestaltx-round2-20261110]
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.label }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: [{"label":"preserve-app-group-caches","sha":"c2af7e56f4298a2c389c7e1692ca73c681f83320","tests":"[\"tests/CacheDirectoryTests.m\"]"},{"label":"preserve-backup-on-delete-failure","sha":"82828065ac6a3dc7c037ba0a6ff1bb3cf7590623","tests":"[\"tests/BackupDeletionTests.swift\"]"},{"label":"complete-original-history-migration","sha":"47d37a5a43a0dae1f2d7c408677776a5be116bc6","tests":"[\"tests/DocumentTests.swift\",\"tests/OriginalHistoryMigrationTests.swift\",\"tests/WAPITests.swift\"]"},{"label":"confirm-internal-build-preset","sha":"3d32fd6b9844926375c044c4636ad1145b57a245","tests":"[\"tests/CapabilityCatalogTests.swift\"]"},{"label":"compare-nan-plist-values","sha":"4ce4b91e0381cced819740b0a3c9431c99bcd2a1","tests":"[\"tests/NonFinitePlistTests.swift\"]"},{"label":"retry-temporary-shared-imports","sha":"f7b691fa559643aa7dae4f2423fd6abc56bd88d2","tests":"[\"tests/CapabilityCatalogTests.swift\"]"},{"label":"defer-direct-file-imports","sha":"867b0880de6692959ed4d732fb8d866c7201eebe","tests":"[\"tests/DirectFileImportTests.swift\"]"},{"label":"read-shared-imports-off-main","sha":"a7f799e608f3651897c1c4d29313dee1b8b88ba5","tests":"[\"tests/SharedImportWorkerTests.swift\"]"},{"label":"upstream-baseline","sha":"c6c22fc44da67e5c22e6fd7cf00a1cece4b4376d","tests":"[]"}]
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          path: source
      - name: Compile and run regression tests
        env:
          GX_TESTS: ${{ matrix.tests }}
        run: python3 harness/validation/run_native.py source
      - name: Build iOS simulator app and extension
        working-directory: source
        run: xcodebuild -quiet -project GestaltX.xcodeproj -target GestaltX -configuration Debug -sdk iphonesimulator SYMROOT="$RUNNER_TEMP/gx-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
