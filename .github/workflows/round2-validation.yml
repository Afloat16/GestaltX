name: Round 2 native validation
on:
  push:
    branches: [validation/gestaltx-round2-20261110]
permissions:
  contents: read
jobs:
  baseline-proof:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          path: source
          ref: e6ee31c60d93f7f8da51236d492ca927677e1de8
          fetch-depth: 0
      - name: Prove regressions against unchanged upstream production sources
        run: python3 harness/validation/run_round2_baseline.py --repo source --tests-ref HEAD --output-dir "$RUNNER_TEMP/round2-baseline"
      - name: Preserve exact sources and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: round2-baseline-proof
          path: ${{ runner.temp }}/round2-baseline
          retention-days: 14
