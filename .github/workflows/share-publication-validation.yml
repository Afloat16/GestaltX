name: Shared publication native regression validation

on:
  push:
    branches: [validation/gestaltx-share-publication-20261112]

permissions:
  contents: read

jobs:
  native-regressions:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          uname -s
          xcodebuild -version
          swiftc --version
      - name: Compare original and revised publication behavior
        run: python3 tests/run_shared_publication.py --repo . --base c60519c619ced032a0b174c13062b3b9bc9ee86f --output "$RUNNER_TEMP/share-publication-evidence"
      - name: Build the app and share extension
        run: |
          xcodebuild -quiet -project GestaltX.xcodeproj -target GestaltX \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/publication-build" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
      - name: Preserve source provenance and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: share-publication-evidence
          path: ${{ runner.temp }}/share-publication-evidence
          retention-days: 14
