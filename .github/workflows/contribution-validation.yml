name: Contribution validation

on:
  push:
    branches: [validation/gestaltx-20261110]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fix/coordinated-plist-imports
            ref: 2f6a105206d835c9318f520c036790a511e8a972
          - name: fix/drain-shared-import-queue
            ref: 0a6db9afc8cf317e82a1108e0babe294b48a815d
          - name: validation/combined-fixes
            ref: 5dd106c9fd3779cbeb495bf4a6d4b81e653062cc
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: source
      - name: Run regression executables
        working-directory: source
        run: bash ../harness/.github/scripts/validate-contribution.sh
      - name: Build the app and share extension
        working-directory: source
        run: |
          xcodebuild -quiet -project GestaltX.xcodeproj -target GestaltX \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/gx-build" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build


  baseline-reproductions:
    name: Reproduce original defects
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compile original production code and reproduce the defects
        env:
          GX_RUN_FIXED: 0
        run: bash .github/scripts/baseline-reproduction.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/baseline-evidence"
      - name: Print exact regression evidence
        run: cat "$RUNNER_TEMP/baseline-evidence/results.jsonl"
