name: Contribution validation

on:
  push:
    branches: [validation/gestaltx-20261110]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fix/unsigned-integer-values
            ref: 5a661357c3b82d1588c9e6bc658cd4a844cec48a
          - name: fix/backup-layout-validation
            ref: 40041328d0b4501f4865a4ae60e165bed8058565
          - name: fix/preserve-field-value-precision
            ref: 98e99b20614b7c6fc31c88971e26c9b67fa172a7
          - name: fix/backup-content-integrity
            ref: a60714267a31d5c343838498928498a5e6e3e96e
          - name: fix/shared-inbox-regular-files
            ref: 3f6bae17429f009572fb647c5be1ca93679183cf
          - name: fix/coordinated-plist-imports
            ref: a66f700f5f9d05d59079af7e4c45d22361ff470d
          - name: fix/cancel-share-provider-loads
            ref: 87ecffdf1d1961f049d47b1bfa6ddc70577f702c
          - name: fix/backup-pending-edits
            ref: 230cfec9dc7aa79da7044ff3f35dfa50216292a3
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: source
      - name: Run regression executables
        working-directory: source
        run: bash ../harness/.github/scripts/validate-contribution.sh
      - name: Build the app and share extension
        working-directory: source
        run: |
          xcodebuild -quiet -project GestaltX.xcodeproj -target GestaltX \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/gx-build" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
