name: Contribution validation

on:
  push:
    branches: [validation/gestaltx-20261110]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fix/preserve-field-value-precision
            ref: 27eee326fa6a86e6c0dd9c39d3122f4a264f6743
          - name: fix/preserve-malformed-artwork
            ref: 9c58ffd2c44cf99232ff98ddae4fdb933bfdeb8e
          - name: fix/drain-shared-import-queue
            ref: adde61dcc3683e7bb7262a69dc23cc813f0f1dd6
          - name: validation/combined-fixes
            ref: d28b19a7632a70ec6a74a48ab83b587d57431ff2
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: source
      - name: Run regression executables
        working-directory: source
        run: bash ../harness/.github/scripts/validate-contribution.sh
      - name: Build the app and share extension
        working-directory: source
        run: |
          xcodebuild -quiet -project GestaltX.xcodeproj -target GestaltX \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/gx-build" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
