name: Combined ten-change native compatibility validation

on:
  push:
    branches: [validation/gestaltx-integration-20261112]

permissions:
  contents: read

jobs:
  native-regressions:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          uname -s
          xcodebuild -version
          swiftc --version
      - name: Run all ten new regressions with the combined production changes
        run: python3 validation/run_combined_regressions.py --repo . --output "$RUNNER_TEMP/combined-evidence"
      - name: Build the app and share extension
        run: |
          xcodebuild -quiet -project GestaltX.xcodeproj -target GestaltX \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/combined-build" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
      - name: Preserve source provenance and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-compatibility-evidence
          path: ${{ runner.temp }}/combined-evidence
          retention-days: 14
